name: Create Release

on:
  push:
    branches:
      - master
    paths:
      - ".github/release-notes/*.md"
      - ".github/workflows/create-release.yaml"
      - "custom_components/dual_smart_thermostat/manifest.json"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create (e.g. v0.14.3)"
        required: true
        type: string
      title:
        description: "Release title (overrides .github/release-notes/<tag>.title)"
        required: false
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve tag and title
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_TITLE: ${{ inputs.title }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            # Releases are cut from the version in the manifest; a push where
            # the manifest version already has a release is a no-op.
            tag=$(jq -r .version custom_components/dual_smart_thermostat/manifest.json)
          else
            tag="$INPUT_TAG"
          fi
          title="$INPUT_TITLE"
          if [ -z "$title" ] && [ -f ".github/release-notes/$tag.title" ]; then
            title=$(head -n 1 ".github/release-notes/$tag.title")
          fi
          if [ -z "$title" ]; then
            title="$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          if [ ! -f ".github/release-notes/$TAG.md" ]; then
            if [ "$EVENT_NAME" = "push" ]; then
              echo "::notice::No release notes at .github/release-notes/$TAG.md; skipping release."
              exit 0
            fi
            echo "::error::Missing release notes file .github/release-notes/$TAG.md"
            exit 1
          fi
          version=$(jq -r .version custom_components/dual_smart_thermostat/manifest.json)
          if [ "$version" != "$TAG" ]; then
            echo "::error::manifest.json version ($version) does not match tag ($TAG)"
            exit 1
          fi
          args=()
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file ".github/release-notes/$TAG.md" \
            "${args[@]}"
